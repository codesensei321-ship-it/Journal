<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Zaid Journal - Intelligent Daily Reflection</title>
    <meta name="description" content="A Notion-style intelligent daily journal with slash-command block editing, date consistency calendar, and AI conversational search." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Browser/Iframe environment patch for polyfills attempting to patch window.fetch
      try {
        if (typeof window !== 'undefined' && window.fetch) {
          const originalFetch = window.fetch.bind(window);
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return currentFetch; },
            set: function(val) { currentFetch = val; },
            configurable: true,
            enumerable: true
          });
        }
      } catch (err) {
        console.debug('Fetch property patch handled:', err);
      }
    </script>
  </head>
  <body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased font-sans transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
